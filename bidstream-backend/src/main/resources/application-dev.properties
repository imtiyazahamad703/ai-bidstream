server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/bidstream_dev
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

spring.data.mongodb.uri=${MONGODB_URI}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Gemini API Keys (Fallback list - Safe to push to GitHub as these are just environment variable references)
gemini.api.keys=${GEMINI_IMTIYAZAHAMAD703_API_KEY:},${GEMINI_IK6124518_API_KEY:},${GEMINI_IK6124519_API_KEY:},${GEMINI_IK6124520_API_KEY:},${GEMINI_IK6124521_API_KEY:},${GEMINI_immu70391_API_KEY:},${GEMINI_VESIT_API_KEY:}

# Groq API Keys (Used as fallback when Gemini fails)
groq.api.keys=${GROQ_IMTIYAZAHAMAD703_API_KEY:},${GROQ_IK6124518_API_KEY:},${GROQ_IK6124519_API_KEY:},${GROQ_IK6124520_API_KEY:},${GROQ_IK6124521_API_KEY:},${GROQ_immu70391_API_KEY:},${GROQ_VESIT_API_KEY:}
